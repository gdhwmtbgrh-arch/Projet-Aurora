<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurora Budget</title>
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f4f6f8; --card:#fff; --ink:#14202b; --muted:#66778a; --line:#e3e8ee;
  --accent:#0f766e; --accent-ink:#fff; --good:#15803d; --warn:#b45309; --bad:#b91c1c;
  --in:#22c55e; --out:#6366f1; --sub:#0ea5e9; --spent:#f59e0b;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c1319; --card:#151e27; --ink:#e8eef4; --muted:#8a9bad; --line:#25313d;
  --accent:#2dd4bf; --accent-ink:#052925; --good:#4ade80; --warn:#fbbf24; --bad:#f87171; --shadow:none;
}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
main{max-width:640px;margin:0 auto;padding:16px}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:600}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)} .muted{color:var(--muted)}
.cyc{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cyc b{font-size:1rem}
.cyc button{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:10px;width:40px;height:40px;font-size:1.1rem;cursor:pointer}
.cyc button:disabled{opacity:.3}
.hero{text-align:center;padding:22px 16px}
.hero .big{font-size:2.8rem;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.hero .sub{color:var(--muted);margin-top:6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.grid3 div{background:var(--bg);border-radius:12px;padding:10px 4px}
.grid3 b{display:block;font-size:1rem}
.grid3 span{font-size:.72rem;color:var(--muted)}
.wf{display:grid;grid-template-columns:112px 1fr 84px;gap:8px;align-items:center;padding:5px 0}
.wf .wl{font-size:.82rem;line-height:1.2}
.wf .wb{position:relative;height:16px;background:var(--bg);border-radius:8px;overflow:hidden}
.wf .wb i{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--out)}
.wf .wv{text-align:right;font-size:.85rem;font-variant-numeric:tabular-nums;font-weight:600}
.wf.in i{background:var(--in)} .wf.sub i{background:var(--sub)} .wf.spent i{background:var(--spent)} .wf.end i{background:var(--good)} .wf.neg i{background:var(--bad)}
.wf.tot{border-top:1px solid var(--line);margin-top:4px;padding-top:9px}
.wf.tot .wl,.wf.tot .wv{font-weight:700}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .l{min-width:0}
.row .l small{display:block;color:var(--muted)}
.row .r{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.item{cursor:pointer}
.pill{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:99px;background:var(--bg);color:var(--muted);margin-left:6px;vertical-align:middle}
.hint{background:var(--bg);border-radius:12px;padding:12px;color:var(--muted);font-size:.9rem}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;max-width:140px;background:none;border:0;color:var(--muted);padding:10px 4px 12px;font:inherit;font-size:.74rem;cursor:pointer}
nav.tabs button span{display:block;font-size:1.3rem;line-height:1.2}
nav.tabs button[aria-selected=true]{color:var(--accent);font-weight:700}
button.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer}
button.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
button.btn.danger{background:none;color:var(--bad);border:1px solid var(--line)}
.fab{position:fixed;right:18px;bottom:88px;width:56px;height:56px;border-radius:50%;font-size:1.8rem;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.25);padding:0}
label{display:block;font-size:.8rem;color:var(--muted);margin:10px 0 4px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
input[type=checkbox]{width:auto;margin-right:8px}
.chk{display:flex;align-items:center;color:var(--ink);font-size:.9rem;margin-top:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.confirm{display:grid;grid-template-columns:1fr 96px auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.confirm:last-child{border-bottom:0}
.confirm small{display:block;color:var(--muted)}
dialog{border:0;border-radius:18px;padding:18px;width:min(92vw,440px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
</style>
</head>
<body>
<main><div id="view"></div></main>
<nav class="tabs" id="tabs">
  <button data-tab="home"><span>🏠</span>Mon mois</button>
  <button data-tab="fixed"><span>🔁</span>Fixes</button>
  <button data-tab="set"><span>⚙️</span>Réglages</button>
</nav>
<dialog id="dlg"></dialog>
<input type="file" id="file" accept="application/json" hidden>

<script>
'use strict';
/* ---------- utilitaires ---------- */
const $=(s,el=document)=>el.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const dim=(y,m)=>new Date(y,m+1,0).getDate();
const dayIn=(y,m,day)=>new Date(y,m,Math.min(day,dim(y,m)));
const daysBetween=(a,b)=>Math.round((b-a)/864e5);
const today=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())};
const eur=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
const money=n=>eur.format(Math.round(n*100)/100+0);
const fd=d=>d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const GROUPS=['Logement & prêts','Énergie, eau, télécom','Enfants','Impôts & banque','Épargne','Autre'];

/* ---------- données ---------- */
const KEY='aurora-budget-v2';
const defaults=()=>({settings:{cycleStart:20,savings:0},fixed:[],spends:[],actuals:{},banked:{}});
const normalize=j=>{const d=defaults();return {...d,...j,settings:{...d.settings,...j.settings},fixed:j.fixed||[],spends:j.spends||[],actuals:j.actuals||{},banked:j.banked||{}}};
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&Array.isArray(j.fixed))return normalize(j)}catch(e){}return defaults()}
let S=load();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ---------- moteur : un mois = du jour 20 au 19 ---------- */
function cycleOf(d){
  const cs=S.settings.cycleStart; let y=d.getFullYear(), m=d.getMonth();
  if(d.getDate()<Math.min(cs,dim(y,m))) m--;
  const start=dayIn(y,m,cs), next=dayIn(y,m+1,cs);
  return {start,next,end:addDays(next,-1),key:iso(start)};
}
const shiftCycle=(c,n)=>cycleOf(dayIn(c.start.getFullYear(),c.start.getMonth()+n,S.settings.cycleStart));
// date de prélèvement/versement d'un élément fixe dans ce cycle
function occurrence(f,c){
  let o=dayIn(c.start.getFullYear(),c.start.getMonth(),f.day);
  if(o<c.start) o=dayIn(c.start.getFullYear(),c.start.getMonth()+1,f.day);
  return o;
}
const actKey=(f,c)=>f.id+'|'+c.key;
const amountOf=(f,c)=>S.actuals[actKey(f,c)]??f.amount;
function budget(c){
  let income=0,surplus=0,out=0; const groups={};
  for(const f of S.fixed){
    const a=amountOf(f,c);
    if(f.kind==='income'){ if(f.est&&a>f.amount){income+=f.amount;surplus+=a-f.amount} else income+=a }
    else{ out+=a; groups[f.cat]=(groups[f.cat]||0)+a }
  }
  const spent=S.spends.filter(x=>{const d=parse(x.date);return d>=c.start&&d<=c.end}).reduce((a,x)=>a+x.amount,0);
  const rav=income-out;
  return {income,surplus,out,groups,spent,rav,left:rav-spent};
}

/* ---------- rendu ---------- */
let tab='home', off=0;
const view=$('#view');

function waterfall(b){
  const total=b.income||1, rows=[];
  let run=b.income;
  rows.push({l:'Entrées',from:0,to:b.income,v:money(b.income),cls:'in'});
  for(const [g,v] of Object.entries(b.groups).sort((a,c)=>c[1]-a[1])){
    rows.push({l:g,from:run-v,to:run,v:'− '+money(v),cls:'out'}); run-=v;
  }
  rows.push({l:'Reste à vivre',from:0,to:run,v:money(run),cls:'sub tot'});
  rows.push({l:'Dépensé ce mois',from:run-b.spent,to:run,v:'− '+money(b.spent),cls:'spent'});
  const left=run-b.spent;
  rows.push({l:'Il reste à dépenser',from:0,to:left,v:money(left),cls:(left<0?'neg':'end')+' tot'});
  return rows.map(r=>{
    const a=Math.max(Math.min(r.from,r.to),0), z=Math.max(r.to,r.from,0);
    return `<div class="wf ${r.cls}"><div class="wl">${esc(r.l)}</div><div class="wb"><i style="left:${a/total*100}%;width:${Math.min(100-a/total*100,(z-a)/total*100)}%"></i></div><div class="wv">${r.v}</div></div>`;
  }).join('');
}

function home(){
  const T=today(), c=shiftCycle(cycleOf(T),off), cur=off===0, b=budget(c);
  const daysLeft=cur?daysBetween(T,c.end)+1:0;
  const perDay=daysLeft>0?b.left/daysLeft:0;
  const cls=b.left<0?'bad':(cur&&perDay<8?'warn':'good');
  let h=`<div class="cyc"><button data-a="prev" aria-label="Mois précédent">◀</button><b>${fd(c.start)} → ${fd(c.end)}${cur?'':'<span class="pill">passé</span>'}</b><button data-a="next" aria-label="Mois suivant"${off>=0?' disabled':''}>▶</button></div>`;
  if(!S.fixed.length) h+=`<div class="card hint">👋 Pour commencer : <button class="btn" data-a="import">Importer mon fichier</button> ou ajoute tes entrées et sorties dans <b>Fixes</b>.</div>`;
  h+=`<div class="card hero"><h2>Il me reste à dépenser</h2>
    <div class="big ${cls}">${money(b.left)}</div>
    <div class="sub">${b.left<0?'⚠️ Budget du mois dépassé':cur?`≈ <b>${money(perDay)}</b> par jour · ${daysLeft} jour${daysLeft>1?'s':''} restants`:'Fin du mois'}</div>
    <div class="grid3"><div><b>${money(b.rav)}</b><span>Reste à vivre</span></div><div><b>${money(b.spent)}</b><span>Dépensé</span></div><div><b>${money(b.out)}</b><span>Sorties fixes</span></div></div></div>`;

  // à confirmer (jour de prélèvement passé, montant estimé)
  if(cur){
    const pend=S.fixed.filter(f=>f.est&&occurrence(f,c)<=T&&S.actuals[actKey(f,c)]==null);
    if(pend.length) h+=`<div class="card"><h2>À confirmer · montant réel</h2>${pend.map(f=>`<div class="confirm"><div>${esc(f.label)}<small>${f.kind==='income'?'reçu':'prélevé'} le ${fd(occurrence(f,c))} · estimé ${money(f.amount)}</small></div><input type="number" step="0.01" min="0" value="${f.amount}" data-conf="${f.id}"><button class="btn" data-a="confirm" data-id="${f.id}">OK</button></div>`).join('')}</div>`;
    if(b.surplus>0&&!S.banked[c.key]) h+=`<div class="card"><h2>Surplus à mettre de côté</h2><div class="row"><div class="l">Tu as touché plus que prévu<small>au-delà de l'estimation</small></div><div class="r good">+ ${money(b.surplus)}</div></div><div class="actions"><button class="btn" data-a="bank" data-v="${b.surplus}">Mis de côté ✓</button></div></div>`;
  }

  h+=`<div class="card"><h2>Entrées → sorties → reste</h2>${waterfall(b)}</div>`;

  h+=`<form class="card" id="quick"><h2>Noter une dépense</h2>
    <div class="two"><input name="amount" type="number" step="0.01" min="0.01" placeholder="Montant €" required><input name="label" placeholder="Quoi ? (courses…)"></div>
    <div class="actions"><button class="btn" type="submit" style="width:100%">Ajouter</button></div></form>`;

  const list=S.spends.filter(x=>{const d=parse(x.date);return d>=c.start&&d<=c.end}).sort((a,z)=>z.date.localeCompare(a.date));
  h+=`<div class="card"><h2>Dépenses du mois (${list.length})</h2>${list.length?list.map(x=>`<div class="row item" data-a="edit-spend" data-id="${x.id}"><div class="l">${esc(x.label)}<small>${fd(parse(x.date))}</small></div><div class="r">− ${money(x.amount)}</div></div>`).join(''):'<div class="muted">Aucune dépense notée sur ce mois.</div>'}</div>`;
  if(S.settings.savings>0) h+=`<div class="card"><div class="row"><span>Épargne (Livret A…)</span><span class="r">${money(S.settings.savings)}</span></div></div>`;
  return h;
}

function fixedView(){
  const part=k=>S.fixed.filter(f=>f.kind===k).sort((a,b)=>a.day-b.day);
  const blk=(title,k)=>{const l=part(k),t=l.reduce((a,f)=>a+f.amount,0);
    return `<div class="card"><h2>${title} · ${money(t)}</h2>${l.length?l.map(f=>`<div class="row item" data-a="edit-fixed" data-id="${f.id}"><div class="l">${esc(f.label)}${f.est?'<span class="pill">estimé</span>':''}<small>le ${f.day} · ${esc(f.cat)}</small></div><div class="r">${money(f.amount)}</div></div>`).join(''):'<div class="muted">Rien pour l\'instant.</div>'}</div>`};
  return blk('Entrées par mois','income')+blk('Sorties fixes par mois','expense')+`<button class="btn fab" data-a="add-fixed" aria-label="Ajouter">+</button>`;
}

function setView(){
  const st=S.settings;
  return `<form class="card" id="setForm"><h2>Réglages</h2>
    <label>Le mois commence le (jour)</label><input name="cycleStart" type="number" min="1" max="31" value="${st.cycleStart}" required>
    <label>Épargne actuelle (€)</label><input name="savings" type="number" step="0.01" value="${st.savings}">
    <div class="actions"><button class="btn" type="submit">Enregistrer</button></div></form>
    <div class="card"><h2>Rappels de prélèvement</h2>
      <p class="muted" style="margin-top:0">Une notification par jour de prélèvement estimé, dans ton calendrier téléphone, pour saisir le montant réel.</p>
      <div class="actions" style="justify-content:flex-start"><button class="btn ghost" data-a="ics">Exporter les rappels (.ics)</button></div></div>
    <div class="card"><h2>Données</h2>
      <p class="muted" style="margin-top:0">Tout reste sur cet appareil. Exporte une sauvegarde de temps en temps.</p>
      <div class="actions" style="justify-content:flex-start"><button class="btn ghost" data-a="export">Exporter</button><button class="btn ghost" data-a="import">Importer</button><button class="btn danger" data-a="reset">Tout effacer</button></div></div>`;
}

function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  view.innerHTML={home,fixed:fixedView,set:setView}[tab]();
}

/* ---------- formulaires ---------- */
const dlg=$('#dlg');
const opts=(list,sel)=>list.map(v=>`<option${v===sel?' selected':''}>${esc(v)}</option>`).join('');
function removeFrom(arr,id){const i=arr.findIndex(x=>x.id===id);if(i>=0)arr.splice(i,1)}
function openFixed(item){
  const it=item||{label:'',amount:'',day:1,kind:'expense',cat:GROUPS[0],est:false};
  dlg.innerHTML=`<form method="dialog" id="f"><h2>${item?'Modifier':'Ajouter'} un élément fixe</h2>
    <label>Libellé</label><input name="label" value="${esc(it.label)}" required>
    <div class="two"><div><label>Montant par mois (€)</label><input name="amount" type="number" step="0.01" min="0.01" value="${it.amount}" required></div>
    <div><label>Jour du mois</label><input name="day" type="number" min="1" max="31" value="${it.day}" required></div></div>
    <div class="two"><div><label>Type</label><select name="kind"><option value="expense"${it.kind==='expense'?' selected':''}>Sortie</option><option value="income"${it.kind==='income'?' selected':''}>Entrée</option></select></div>
    <div><label>Catégorie</label><select name="cat">${opts(GROUPS,it.cat)}</select></div></div>
    <label class="chk"><input type="checkbox" name="est"${it.est?' checked':''}>Montant estimé (je confirmerai le réel ce jour-là)</label>
    <div class="actions">${item?'<button class="btn danger" type="button" id="del">Supprimer</button>':''}<button class="btn ghost" type="button" id="cancel">Annuler</button><button class="btn" type="submit">Enregistrer</button></div></form>`;
  $('#cancel').onclick=()=>dlg.close();
  if(item) $('#del').onclick=()=>{if(confirm('Supprimer ?')){removeFrom(S.fixed,item.id);save();dlg.close();render()}};
  $('#f').onsubmit=e=>{
    e.preventDefault();
    const f=e.target, o={id:it.id||uid(),label:f.label.value.trim(),amount:Math.abs(parseFloat(f.amount.value)),day:Math.min(31,Math.max(1,parseInt(f.day.value)||1)),kind:f.kind.value,cat:f.cat.value,est:f.est.checked};
    if(!o.label||!(o.amount>0)) return;
    const i=S.fixed.findIndex(x=>x.id===o.id); i>=0?S.fixed[i]=o:S.fixed.push(o);
    save();dlg.close();render();
  };
  dlg.showModal();
}
function openSpend(item){
  dlg.innerHTML=`<form method="dialog" id="f"><h2>Modifier la dépense</h2>
    <label>Libellé</label><input name="label" value="${esc(item.label)}" required>
    <div class="two"><div><label>Montant (€)</label><input name="amount" type="number" step="0.01" min="0.01" value="${item.amount}" required></div>
    <div><label>Date</label><input name="date" type="date" value="${item.date}" required></div></div>
    <div class="actions"><button class="btn danger" type="button" id="del">Supprimer</button><button class="btn ghost" type="button" id="cancel">Annuler</button><button class="btn" type="submit">Enregistrer</button></div></form>`;
  $('#cancel').onclick=()=>dlg.close();
  $('#del').onclick=()=>{removeFrom(S.spends,item.id);save();dlg.close();render()};
  $('#f').onsubmit=e=>{e.preventDefault();const f=e.target;Object.assign(item,{label:f.label.value.trim()||'Dépense',amount:Math.abs(parseFloat(f.amount.value)),date:f.date.value});save();dlg.close();render()};
  dlg.showModal();
}

/* ---------- rappels calendrier (.ics) ---------- */
function ics(){
  const T=today(), c=cycleOf(T), ev=S.fixed.filter(f=>f.est).map(f=>{
    const o=occurrence(f,c), ds=`${o.getFullYear()}${pad(o.getMonth()+1)}${pad(o.getDate())}`;
    const txt=s=>s.replace(/[\\,;]/g,m=>'\\'+m);
    return ['BEGIN:VEVENT',`UID:${f.id}@aurora-budget`,`DTSTAMP:${ds}T000000Z`,`DTSTART:${ds}T090000`,`DTEND:${ds}T091500`,`RRULE:FREQ=MONTHLY;BYMONTHDAY=${f.day>28?-1:f.day}`,
      `SUMMARY:${txt((f.kind==='income'?'Versement : ':'Prélèvement : ')+f.label+' — saisir le montant réel')}`,'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:Aurora Budget','TRIGGER:PT0S','END:VALARM','END:VEVENT'].join('\r\n');
  });
  if(!ev.length){alert('Aucun élément marqué « estimé ».');return}
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Aurora Budget//FR',...ev,'END:VCALENDAR'].join('\r\n')],{type:'text/calendar'}));
  a.download='rappels-prelevements.ics';a.click();
}

/* ---------- actions ---------- */
const actions={
  prev:()=>{off--;render()}, next:()=>{if(off<0){off++;render()}},
  'add-fixed':()=>openFixed(),
  'edit-fixed':el=>openFixed(S.fixed.find(x=>x.id===el.dataset.id)),
  'edit-spend':el=>openSpend(S.spends.find(x=>x.id===el.dataset.id)),
  confirm:el=>{
    const f=S.fixed.find(x=>x.id===el.dataset.id), inp=$(`[data-conf="${f.id}"]`), v=parseFloat(inp.value);
    if(!(v>=0)) return;
    S.actuals[actKey(f,shiftCycle(cycleOf(today()),off))]=v; save(); render();
  },
  bank:el=>{S.settings.savings=(S.settings.savings||0)+parseFloat(el.dataset.v);S.banked[shiftCycle(cycleOf(today()),off).key]=parseFloat(el.dataset.v);save();render()},
  ics,
  export:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download=`aurora-budget-${iso(today())}.json`;a.click()},
  import:()=>$('#file').click(),
  reset:()=>{if(confirm('Tout effacer définitivement ?')){S=defaults();save();render()}}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab]'); if(t){tab=t.dataset.tab;render();scrollTo(0,0);return}
  const a=e.target.closest('[data-a]'); if(a&&actions[a.dataset.a]) actions[a.dataset.a](a);
});
document.addEventListener('change',e=>{
  if(e.target.id!=='file') return;
  const f=e.target.files[0]; if(!f) return;
  f.text().then(t=>{const j=JSON.parse(t); if(!Array.isArray(j.fixed)) throw 0; S=normalize(j); save(); tab='home'; off=0; render()}).catch(()=>alert('Fichier invalide (il faut une sauvegarde de cette version de l\'appli).'));
  e.target.value='';
});
document.addEventListener('submit',e=>{
  if(e.target.id==='quick'){
    e.preventDefault();
    const f=e.target, amount=Math.abs(parseFloat(f.amount.value)); if(!(amount>0)) return;
    S.spends.push({id:uid(),date:iso(today()),label:f.label.value.trim()||'Dépense',amount}); save(); render(); return;
  }
  if(e.target.id==='setForm'){
    e.preventDefault();
    const f=e.target; S.settings.cycleStart=Math.min(31,Math.max(1,parseInt(f.cycleStart.value)||20)); S.settings.savings=parseFloat(f.savings.value)||0;
    save(); tab='home'; off=0; render();
  }
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!dlg.open&&tab==='home')render()});
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
